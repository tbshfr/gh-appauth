{{define "content"}}
<header class="page-head">
  <div>
    <h1>Request history</h1>
    <p class="lede">Every token request the broker has answered, newest first.</p>
  </div>
</header>

<section class="card">
  <header class="card-head"><h2>Filter</h2></header>
  <form method="get" action="/ui/history" class="filters">
    <label class="field"><span class="label">Client</span>
      <select name="client">
        <option value="">Any</option>
        {{range .Data.Clients}}<option {{if eq . $.Data.Filter.Client}}selected{{end}}>{{.}}</option>{{end}}
      </select>
    </label>
    <label class="field"><span class="label">Event</span>
      <select name="event">
        <option value="">Any</option>
        {{range .Data.Events}}<option {{if eq . $.Data.Filter.Event}}selected{{end}}>{{.}}</option>{{end}}
      </select>
    </label>
    <label class="field"><span class="label">Repo contains</span>
      <input name="repo" value="{{.Data.Filter.Repo}}" placeholder="acme/web"></label>
    <button>Apply</button>
    <a href="/ui/history" class="reset">Reset</a>
  </form>
  {{template "events" .Data.Rows}}
  {{if .Data.Next}}<footer class="card-foot"><span></span><a class="btn" href="{{.Data.Next}}">Older →</a></footer>{{end}}
</section>
{{end}}
