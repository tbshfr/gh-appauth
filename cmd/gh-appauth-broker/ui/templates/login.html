{{define "content"}}
<section class="card narrow">
  <h1>Sign in</h1>
  {{if .Data.NoPassword}}
  <p>No admin password has been set yet. On the broker host, run:</p>
  <pre>gh-appauth-broker set-password -db {{.Info.DBPath}}</pre>
  {{else}}
  <form method="post" action="/ui/login" class="stack">
    <label>Admin password <input type="password" name="password" autofocus required autocomplete="current-password"></label>
    <button class="primary">Sign in</button>
  </form>
  {{end}}
</section>
{{end}}
